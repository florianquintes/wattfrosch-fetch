[project]
name = "wattfrosch-fetch"
version = "0.1.0"
description = "Fetch external weather and energy data and normalize it to the wattfrosch data contract (MeasurementRecord)."
authors = [
    { name = "Dr. Florian Quintes", email = "florian@fam-quintes.de" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "tenacity>=9.2.1",
    "wattfrosch-contracts",
]

[project.scripts]
wattfrosch-fetch = "wattfrosch_fetch.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
wattfrosch-contracts = { path = "../wattfrosch-contracts", editable = true }

[tool.pyrefly]
project-includes = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]
