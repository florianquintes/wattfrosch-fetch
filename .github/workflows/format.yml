name: Format and lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wattfrosch-fetch
        uses: actions/checkout@v4
        with:
          path: wattfrosch-fetch

      - name: Checkout wattfrosch-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wattfrosch-contracts
          ref: v0.1.0
          path: wattfrosch-contracts
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: wattfrosch-fetch/uv.lock

      - name: Install dependencies
        working-directory: wattfrosch-fetch
        run: uv sync --dev --locked

      - name: Check formatting
        working-directory: wattfrosch-fetch
        run: uv run ruff format --check .

      - name: Check linting
        working-directory: wattfrosch-fetch
        run: uv run ruff check .
